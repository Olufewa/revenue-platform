$kind: http-request
description: A real token with junk appended. The signature no longer matches, so jwt.verifyAsync throws and the guard turns it into a 401. This is what proves the token is verified rather than merely decoded.
url: "{{baseUrl}}/auth/me"
method: GET
headers:
  Authorization: Bearer {{accessToken}}tampered
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('401 Unauthorized', () => pm.response.to.have.status(401));
      pm.test('says the token is invalid', () => {
        pm.expect(pm.response.json().message).to.include('Invalid or expired token');
      });
    language: text/javascript
order: 8000
