$kind: http-request
description: Creates a user. The password is bcrypt-hashed at cost 10 before it touches the database, and the response is built by publicUser() so passwordHash cannot escape by accident.
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{testEmail}}",
      "name": "Fewa",
      "password": "{{testPassword}}"
    }
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      // A fresh email per run, so this collection never trips over a user
      // it created last time. Request 2 reuses this same value on purpose.
      const email = `fewa+${Date.now()}@mtn.test`;
      pm.collectionVariables.set('testEmail', email);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('201 Created', () => pm.response.to.have.status(201));

      const body = pm.response.json();
      pm.test('returns id, email, name, createdAt', () => {
        pm.expect(body).to.have.all.keys('id', 'email', 'name', 'createdAt');
      });

      // The whole point of publicUser() in IdentityService.
      pm.test('never leaks passwordHash', () => {
        pm.expect(pm.response.text()).to.not.include('passwordHash');
      });
    language: text/javascript
order: 1000
