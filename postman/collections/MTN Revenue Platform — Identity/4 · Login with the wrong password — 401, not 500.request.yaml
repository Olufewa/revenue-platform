$kind: http-request
description: "Two things being checked at once: that a bad password is a 401 rather than a crash, and that the message is identical to the one an unknown email gets."
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{testEmail}}",
      "password": "wrongpassword"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('401 Unauthorized', () => pm.response.to.have.status(401));

      // The Gym Padi bug was a try/catch swallowing this and returning 500.
      pm.test('is not a 500', () => pm.expect(pm.response.code).to.not.equal(500));

      // Same wording as an unknown email, so nobody can probe which
      // addresses are registered by reading the error message.
      pm.test('message does not reveal whether the account exists', () => {
        pm.expect(pm.response.json().message).to.eql('Email or password is incorrect');
      });
    language: text/javascript
order: 4000
