$kind: collection
description: |-
  Endpoints for the revenue-platform server as of the identity module (modules 1 & 2).

  Base URL and the JWT are collection variables, so nothing needs an environment file.

  How to use it:
  1. Start the API:  cd packages/server && npm run start:dev
  2. Run the requests top to bottom, or hit Run to run the whole folder.

  "1 · Register" invents a fresh email each time it runs and saves it as {{testEmail}}, so the whole collection can be re-run as often as you like without a 409 from a leftover user. "3 · Login" saves the token into {{accessToken}} automatically — you never copy-paste a JWT.

  Every request has a test that asserts the status code that decision is supposed to produce. Green means the behaviour is right, not just that the server answered.
variables:
  baseUrl: http://localhost:3003
  testEmail: ""
  testPassword: supersecret1
  accessToken: ""
auth:
  - id: 5251e0c7-f2f8-4050-8021-283c0bcf74b1
    type: bearer
    name: bearer auth
    credentials:
      token: "{{accessToken}}"
