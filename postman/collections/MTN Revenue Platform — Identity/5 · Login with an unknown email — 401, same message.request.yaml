$kind: http-request
description: The other half of the pair. If this message ever differs from request 4's, account enumeration is possible.
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "nobody@mtn.test",
      "password": "supersecret1"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('401 Unauthorized', () => pm.response.to.have.status(401));
      pm.test('identical message to a wrong password', () => {
        pm.expect(pm.response.json().message).to.eql('Email or password is incorrect');
      });
    language: text/javascript
order: 5000
