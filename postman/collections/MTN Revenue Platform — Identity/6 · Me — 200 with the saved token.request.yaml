$kind: http-request
description: Uses the collection's bearer auth, which reads {{accessToken}} — set for you by request 3. AuthGuard verifies the JWT and hangs the payload on the request; @CurrentUser() reads it and the service looks the user up by payload.sub.
url: "{{baseUrl}}/auth/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));

      const body = pm.response.json();
      pm.test('is the user who logged in', () => {
        pm.expect(body.email).to.eql(pm.collectionVariables.get('testEmail'));
      });
      pm.test('still no passwordHash', () => {
        pm.expect(pm.response.text()).to.not.include('passwordHash');
      });
    language: text/javascript
order: 6000
